abstract: |
  Towards building an accurate proxy of human behavior from large motion data, a key problem is to model rich individual variation across a population of users. Using motion capture data from 20 keyboard typists, we learn and examine representations of distinct typing styles by training a generative model that replicates typing motions based on example clips from individual typists’ histories. Beyond correctly typing unseen target text, our model captures varied movement and finger use patterns, forming a latent space of typing styles that are separable and interpolable. Our findings suggest that individual examples could provide a basis for expressive behavior control in synthesizing individualized human motion.

