# Teaser: the first thing a visitor sees.
# Priority: `gdrive` > `youtube` > `video` > `image`.
#   gdrive:  Google Drive file ID (the part between /d/ and /view). File must be
#            shared as "Anyone with the link". Drive's player shows the first
#            frame with a play button; it cannot autoplay.
#   youtube: YouTube video ID (the part after v=). Autoplays muted and loops.
#   video:   local mp4, e.g. assets/videos/teaser.mp4. Autoplays muted and loops.
#   image:   still fallback; also the social-card image.
# above_authors: true puts the teaser between the venue line and the author
# list so it is inside the first phone screen. false puts it after the buttons.
teaser:
  gdrive: "1nDvkbQWJSdKKi3tbnyNPvUq6_XpxDycJ"
  youtube: ""
  video: ""
  image: "assets/images/teaser.png"
  caption: ""
  above_authors: true

