    url: "https://example.com/author-one"
    affiliations: [1]
    equal: true
  - name: "Author Two"
    url: "https://example.com/author-two"
    affiliations: [1, 2]
    equal: true
  - name: "Author Three"
    url: ""
    affiliations: [2]

