# Site metadata (used by jekyll-seo-tag for <title>, Open Graph, Twitter cards).
# Page content itself lives in _data/paper.yml.
title: "Generalitve Modeling of How We Type"
tagline: "DexHAND @ ECCV 2026"
description: "TODO: One-sentence summary of the paper for search engines and link previews."
url: "https://typebot-eccv.github.io"
baseurl: ""
lang: en

# Google Analytics 4 measurement ID. Injected only in production builds
# (JEKYLL_ENV=production, which the GitHub Actions workflow sets), so local
# `jekyll serve` previews are not counted. Blank -> no tag.
google_analytics: "G-J4MCRKNC72"

# Social card. Uncomment and set `twitter.username` to attribute the card to an account.
twitter:
  card: summary_large_image
  # username: your_handle

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/teaser.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
  - .github
  - .ruby-version
